[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "treeig"
version = "0.1.8"
description = "Exact Integrated Gradients for tree ensembles."
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
license-files = ["LICENSE"]

authors = [
    { name = "Ludger Hentschel" }
]

keywords = [
    "machine-learning",
    "interpretability",
    "integrated-gradients",
    "feature-attribution",
    "xai",
    "trees",
    "xgboost",
    "lightgbm",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
    "numba>=0.58",
]

[project.optional-dependencies]
sklearn = [
    "scikit-learn>=1.3",
]

xgboost = [
    "xgboost>=2.0",
]

lightgbm = [
    "lightgbm>=4.0",
]

all = [
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "lightgbm>=4.0",
]

dev = [
    "pytest>=8.0",
    "build>=1.0",
    "twine>=5.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "tomli>=2; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/lhentschel/treeig"
Repository = "https://github.com/lhentschel/treeig"
Issues = "https://github.com/lhentschel/treeig/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["treeig*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
